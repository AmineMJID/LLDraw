<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f3f7"/>
      <stop offset=".38" stop-color="#ced5df"/>
      <stop offset=".72" stop-color="#a9b1be"/>
      <stop offset="1" stop-color="#8d95a3"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9bfc9"/>
      <stop offset="1" stop-color="#7f8694"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffedb0"/>
      <stop offset=".45" stop-color="#e8bd4b"/>
      <stop offset="1" stop-color="#9c6d0e"/>
    </linearGradient>
    <linearGradient id="cavity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#171a20"/>
      <stop offset=".6" stop-color="#0b0d11"/>
      <stop offset="1" stop-color="#06070a"/>
    </linearGradient>
    <linearGradient id="cavTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#000000" stop-opacity=".85"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="sheen" cx=".28" cy=".18" r=".95">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".5"/>
      <stop offset=".45" stop-color="#ffffff" stop-opacity=".08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- châssis métallique -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="10" fill="url(#metal)" stroke="#5c6370" stroke-width="1.5"/>
  <!-- biseau interne : liseré clair haut/gauche, ombre bas/droite -->
  <rect x="3.5" y="3.5" width="93" height="93" rx="8.5" fill="none" stroke="#ffffff" stroke-opacity=".6" stroke-width="1.2"/>
  <rect x="2.6" y="2.6" width="94.8" height="94.8" rx="9.4" fill="none" stroke="#3a3f4a" stroke-opacity=".55" stroke-width="1"/>
  <!-- reflet satiné en coin haut-gauche -->
  <rect x="1.5" y="1.5" width="97" height="97" rx="10" fill="url(#sheen)"/>

  <!-- coins de vis (avec éclat) -->
  <g>
    <circle cx="9.5" cy="9.5" r="2.6" fill="#787f8b"/>
    <circle cx="9" cy="9" r=".9" fill="#c7ccd4"/>
    <circle cx="90.5" cy="9.5" r="2.6" fill="#787f8b"/>
    <circle cx="90" cy="9" r=".9" fill="#c7ccd4"/>
    <circle cx="9.5" cy="90.5" r="2.6" fill="#787f8b"/>
    <circle cx="9" cy="90" r=".9" fill="#c7ccd4"/>
    <circle cx="90.5" cy="90.5" r="2.6" fill="#787f8b"/>
    <circle cx="90" cy="90" r=".9" fill="#c7ccd4"/>
  </g>

  <!-- évidement : embout de la fiche (encoche haute) -->
  <path d="M38 12 H62 V22 H80 Q86 22 86 28 V76 Q86 82 80 82 H20 Q14 82 14 76 V28 Q14 22 20 22 H38 Z"
        fill="#23262c" stroke="#181b20" stroke-width="1"/>
  <!-- cavité avec dégradé de profondeur -->
  <path d="M24 30 H76 Q80 30 80 34 V72 Q80 76 76 76 H24 Q20 76 20 72 V34 Q20 30 24 30 Z"
        fill="url(#cavity)"/>
  <!-- ombre interne en haut de cavité -->
  <rect x="20" y="30" width="60" height="12" fill="url(#cavTop)"/>
  <!-- profondeur haute (encoche du latch) -->
  <path d="M40 14 H60 V24 H40 Z" fill="#04050a"/>
  <rect x="24" y="30" width="52" height="8" fill="#191c22"/>

  <!-- numéros 1-8 -->
  <g fill="#8b909b" font-family="Arial, sans-serif" font-size="7.5" font-weight="700" text-anchor="middle">
    <text x="26" y="47">1</text>
    <text x="33.4" y="47">2</text>
    <text x="40.8" y="47">3</text>
    <text x="48.2" y="47">4</text>
    <text x="55.6" y="47">5</text>
    <text x="63" y="47">6</text>
    <text x="70.4" y="47">7</text>
    <text x="77.8" y="47">8</text>
  </g>

  <!-- 8 contacts dorés -->
  <g fill="url(#gold)" stroke="#7c5a08" stroke-width="0.5">
    <rect x="24.2" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="31.6" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="39"   y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="46.4" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="53.8" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="61.2" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="68.6" y="52" width="3.6" height="20" rx="1.4"/>
    <rect x="76"   y="52" width="3.6" height="20" rx="1.4"/>
  </g>
  <!-- ombre des contacts sur le fond de cavité -->
  <g fill="#000000" opacity=".35">
    <rect x="28.2" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="35.6" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="43"   y="53" width="1.6" height="19" rx=".8"/>
    <rect x="50.4" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="57.8" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="65.2" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="72.6" y="53" width="1.6" height="19" rx=".8"/>
    <rect x="80"   y="53" width="1.6" height="19" rx=".8"/>
  </g>
  <!-- reflet sur les contacts -->
  <g fill="#fff6d6" opacity="0.85">
    <rect x="25" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="32.4" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="39.8" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="47.2" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="54.6" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="62" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="69.4" y="53.5" width="1" height="7" rx="0.5"/>
    <rect x="76.8" y="53.5" width="1" height="7" rx="0.5"/>
  </g>
</svg>
